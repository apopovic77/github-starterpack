name: Build & Deploy (PHP)

on:
  push:
    branches:
      - {{MAIN_BRANCH}}
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PHP files
        run: |
          echo "✅ PHP project - validating files"
          ls -la *.php 2>/dev/null | head -10 || echo "No PHP files in root"
          find . -name "*.php" -not -path "./vendor/*" | head -10

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            REPO_PATH="{{REPO_ROOT}}"
            DEPLOY_PATH="{{DEPLOY_PATH}}"
            BACKUP_DIR="/var/backups"
            BACKUP_PREFIX="{{BACKUP_PREFIX}}"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_PATH="$BACKUP_DIR/${BACKUP_PREFIX}-${TIMESTAMP}"

            echo "📂 Repository: $REPO_PATH"
            echo "🎯 Deploy to: $DEPLOY_PATH"

            cd "$REPO_PATH"

            echo "🔄 Fetching latest code..."
            git fetch origin {{MAIN_BRANCH}}
            git reset --hard origin/{{MAIN_BRANCH}}

            echo "✅ PHP project - no dependencies to install"

            if [ -d "$DEPLOY_PATH" ]; then
              echo "💾 Creating backup..."
              mkdir -p "$BACKUP_DIR"
              cp -r "$DEPLOY_PATH" "$BACKUP_PATH"
              echo "✅ Backup created: $BACKUP_PATH"
            fi

            echo "🚀 Deploying PHP files..."
            mkdir -p "$DEPLOY_PATH"
            rsync -av --delete \
              --exclude='.git' \
              --exclude='.devops' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='.gitignore' \
              --exclude='.env' \
              --exclude='*.md' \
              "$REPO_PATH/" "$DEPLOY_PATH/"

            echo "🔒 Setting permissions..."
            chown -R {{WEB_USER}}:{{WEB_GROUP}} "$DEPLOY_PATH"
            chmod -R 755 "$DEPLOY_PATH"
            
            # Make writable directories if they exist
            for dir in logs cache uploads tmp; do
              if [ -d "$DEPLOY_PATH/$dir" ]; then
                chmod -R 775 "$DEPLOY_PATH/$dir"
              fi
            done

            echo "✅ Deployment completed successfully!"
            echo "📁 Live at: {{SITE_URL}}"
            echo "💾 Backup: $BACKUP_PATH"

            # Retention: keep newest 3 backups of THIS project (prefix-scoped).
            # Runs only after success. Unbounded backups filled arkturian to
            # 98% disk (api-ai: 37 generations = 13G, issue #214).
            BACKUP_KEEP=3
            ls -dt "$BACKUP_DIR/${BACKUP_PREFIX}-"* 2>/dev/null | tail -n +$((BACKUP_KEEP + 1)) | while read -r old_backup; do
              rm -rf "$old_backup"
              echo "  pruned old backup: $old_backup"
            done || true

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "📍 Site: {{SITE_URL}}"
          echo "📦 Commit: ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed for commit ${{ github.sha }}"
          echo "Check logs above for details"

