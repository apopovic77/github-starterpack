name: Dev Branch CI

on:
  push:
    branches:
      - {{DEV_BRANCH}}
  pull_request:
    branches:
      - {{MAIN_BRANCH}}

jobs:
  build:
    # Fest self-hosted (Regel 07.10.2026: keine GitHub-gehosteten Runner).
    runs-on: [self-hosted, linux, arkserver]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '{{NODE_VERSION}}'
          # cache: 'npm' bewusst nicht gesetzt (self-hosted-Haenger im Post-Step).

      - name: Authenticate to GitHub Packages
        # Fuer private npm-Scopes (@arkturian, @apopovic77 u.a.).
        if: ${{ env.NPM_TOKEN != '' }}
        run: echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: {{INSTALL_DEPS_COMMAND}}

      - name: Run build
        run: {{BUILD_COMMAND}}
