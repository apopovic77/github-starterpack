name: Build & Deploy

on:
  push:
    branches:
      - {{MAIN_BRANCH}}
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Fest self-hosted (Regel 07.10.2026: keine GitHub-gehosteten Runner,
    # das Konto hat sie gesperrt). Repos ohne arkserver-Runner stattdessen
    # Variable RUNNER_LABEL=arkserver + Fallback-Zeile nutzen.
    runs-on: [self-hosted, linux, arkserver]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '{{NODE_VERSION}}'
          # cache: 'npm' bewusst nicht gesetzt — der setup-node-Post-Step
          # haengt auf self-hosted-Runnern beim cache-save (Issue 3dNerd 2026-10-08).

      - name: Authenticate to GitHub Packages
        # Fuer private npm-Scopes (@arkturian, @apopovic77 u.a.). Skip, wenn
        # NPM_TOKEN leer ist — dann publiziert das Repo keine privaten Deps.
        if: ${{ env.NPM_TOKEN != '' }}
        run: echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: {{INSTALL_DEPS_COMMAND}}

      - name: Build application
        run: {{BUILD_COMMAND}}
        env:
          NODE_ENV: production

      - name: Guard - private DEPLOY_HOST braucht self-hosted Runner
        # NAT-Hairpin-Guard (04.09.2026): wenn DEPLOY_HOST eine private IP
        # ist (self-loop zum arkserver), muss der Runner self-hosted auf
        # arkserver laufen. Fuer `runs-on: [self-hosted, linux, arkserver]`
        # oben greift das immer; der Check ist Backup fuer Varianten mit
        # `runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}`.
        run: |
          case "${{ secrets.DEPLOY_HOST }}" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*)
              if [ -z "${{ vars.RUNNER_LABEL }}" ] && ! echo "${{ runner.name }}" | grep -q arkserver; then
                echo "::error::DEPLOY_HOST ist privat, aber kein arkserver-Runner - SSH wuerde in einen NAT-Timeout laufen."
                exit 1
              fi ;;
          esac

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Fuer arkserver auf port 2224 setzen (DEPLOY_PORT-Secret); fuer
          # andere Hosts auf den jeweiligen Port. Default 22 nur fuer Repos,
          # die DEPLOY_PORT bewusst nicht setzen.
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            # >>> geheim_schuetzen (#3251)
            # Bis 17.11.2026 stand hier `chmod -R 755`: das machte jede .env fuer alle Login-Nutzer
            # lesbar (tools-api, deSEC-Token). Jetzt zwei Schritte:
            #   rechte_setzen <ordner>   Ordner 755, Dateien lesbar und nur fuer den Eigentuemer
            #                            schreibbar; Geheimnisdateien laesst dieser Schritt aus.
            #   geheim_schuetzen <ordner> [dienstbenutzer]
            #                            Geheimnisdateien nie fuer "andere", nie weiter als vorher
            #                            (600 bleibt 600, 644/755 werden 640). Laeuft der Dienst unter
            #                            einem anderen Benutzer als dem Eigentuemer (eventcrawler,
            #                            contentapi ...), gib ihn mit: seine Dateien bekommen dann dessen
            #                            Gruppe. Danach wird nachgeprueft; bleibt eine Datei weltlesbar,
            #                            endet der Lauf mit Fehler.
            # Kanonische Fassung: templates/devops/scripts/geheim-schuetzen.sh, Abgleich: scripts/check-template-rechte.sh
            geheim_finden() {  # <ordner> [--ausser] [find-ausdruck ...]; --ausser = alle Dateien AUSSER Geheimnissen
              _gd="$1"; shift
              _gn=""
              if [ "${1:-}" = "--ausser" ]; then _gn="!"; shift; fi
              [ $# -gt 0 ] || set -- -print
              find "$_gd" \( -name node_modules -o -name venv -o -name .venv -o -name .git -o -name __pycache__ \) -prune -o \
                -type f $_gn \( \( -name '.env' -o -name '.env.*' -o -name '*.key' -o -name '*.pem' -o -name '*token*' \
                  -o -name '*cookies*.txt' -o -name 'credentials*' -o -name 'secrets*' -o -name 'dns_clients.json' \) \
                ! -name '*.example' ! -name '*.sample' ! -name '*.template' \
                ! -name '*.py' ! -name '*.js' ! -name '*.mjs' ! -name '*.cjs' ! -name '*.ts' ! -name '*.map' \
                ! -name '*.css' ! -name '*.html' ! -name '*.md' \) "$@"
            }
            rechte_setzen() {
              [ -d "$1" ] || return 0
              find "$1" -type d -exec chmod u+rwx,go+rx,go-w {} +
              geheim_finden "$1" --ausser -exec chmod u+rw,go+r,go-w {} +
            }
            geheim_schuetzen() {
              [ -d "$1" ] || return 0
              if [ -n "${2:-}" ] && [ "$2" != root ] && id "$2" >/dev/null 2>&1; then
                geheim_finden "$1" ! -user "$2" -exec chgrp "$(id -gn "$2")" {} +
              fi
              geheim_finden "$1" -exec chmod u-x,g-wx,o-rwx {} +
              _go=$(geheim_finden "$1" -perm -004 -print)
              if [ -n "$_go" ]; then
                echo "FEHLER (#3251): Geheimnisdatei(en) weiter fuer alle lesbar:" >&2
                echo "$_go" >&2
                return 1
              fi
              echo "Geheimnisdateien geschuetzt: $1"
            }
            # <<< geheim_schuetzen

            REPO_PATH="{{REPO_ROOT}}"
            DEPLOY_PATH="{{DEPLOY_PATH}}"
            BACKUP_DIR="/var/backups"
            BACKUP_PREFIX="{{BACKUP_PREFIX}}"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_PATH="$BACKUP_DIR/${BACKUP_PREFIX}-${TIMESTAMP}"

            cd "$REPO_PATH"

            git fetch origin {{MAIN_BRANCH}}
            git reset --hard origin/{{MAIN_BRANCH}}

            {{INSTALL_DEPS_COMMAND}}

            {{BUILD_COMMAND}}

            if [ -d "$DEPLOY_PATH" ]; then
              echo "Creating backup..."
              mkdir -p "$BACKUP_DIR"
              cp -r "$DEPLOY_PATH" "$BACKUP_PATH"
              geheim_schuetzen "$BACKUP_PATH"
            fi

            echo "Deploying new build..."
            mkdir -p "$DEPLOY_PATH"
            # Schutz (#1245): Eine leere oder fehlende dist/ wuerde mit --delete das ganze
            # Ziel leeren, samt Laufzeitdaten (issue-api 20.08.2026: issues.db). Abbrechen.
            if [ ! -d "$REPO_PATH/dist" ] || [ -z "$(ls -A "$REPO_PATH/dist")" ]; then
              echo "ABBRUCH: $REPO_PATH/dist fehlt oder ist leer, rsync --delete wuerde $DEPLOY_PATH leeren." >&2
              echo "Projekte ohne Bau-Schritt (Python-APIs) brauchen einen eigenen Auslieferungsweg." >&2
              exit 1
            fi
            rsync -av --delete "$REPO_PATH/dist/" "$DEPLOY_PATH/"

            chown -R {{WEB_USER}}:{{WEB_GROUP}} "$DEPLOY_PATH"
            # Ordner 755, Dateien lesbar ohne Schreibrecht fuer andere, Geheimnisse 640 (#3251: nicht mehr chmod -R 755)
            rechte_setzen "$DEPLOY_PATH"
            geheim_schuetzen "$DEPLOY_PATH"
            geheim_schuetzen "$REPO_PATH"

            echo "Deployment completed successfully!"
            echo "Backup saved to: $BACKUP_PATH"

            # Retention: keep newest 3 backups of THIS project (prefix-scoped).
            # Runs only after success (set -e above). Unbounded backups filled
            # arkturian to 98% disk (api-ai: 37 generations = 13G, issue #214).
            BACKUP_KEEP=3
            ls -dt "$BACKUP_DIR/${BACKUP_PREFIX}-"* 2>/dev/null | tail -n +$((BACKUP_KEEP + 1)) | while read -r old_backup; do
              rm -rf "$old_backup"
              echo "  pruned old backup: $old_backup"
            done || true

      - name: Notify on success
        if: success()
        run: echo "✅ Deployment successful for commit ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed for commit ${{ github.sha }}"
